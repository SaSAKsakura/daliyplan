<!--
  用途：Erow 风格 PC 管理端单文件原型，可直接在浏览器打开。
  依赖：ECharts 5 CDN；不可用时图表区域显示降级说明，其余交互继续工作。
  数据：统一修改 app.js 顶部的 appData，不要把业务数据写进绘图函数。
-->
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erow 示例业务中心</title>
  <style>
:root {
  --erow-primary: #61b2ff;
  --erow-primary-hover: #90c9ff;
  --erow-primary-active: #449cf0;
  --erow-primary-soft: #f3f9ff;
  --erow-page-bg: #f5f6fa;
  --erow-surface: #ffffff;
  --erow-table-head: #eff7ff;
  --erow-border: #dcdfe6;
  --erow-border-soft: #ebeef5;
  --erow-text: #1a1a1a;
  --erow-text-secondary: #999999;
  --erow-text-muted: #8291a9;
  --erow-disabled-bg: #f5f7fa;
  --erow-required-bg: #fffbe6;
  --erow-required-border: #ffe58f;
  --erow-danger: #f56c6c;
  --erow-success: #30b08f;
  --erow-warning: #e6a23c;
  --erow-radius-sm: 4px;
  --erow-radius: 8px;
  --erow-radius-lg: 12px;
  --erow-font: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
html { height: 100%; background: var(--erow-page-bg); }
body {
  min-width: 1200px;
  min-height: 100%;
  margin: 0;
  color: var(--erow-text);
  background: var(--erow-page-bg);
  font: 14px/1.5 var(--erow-font);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
[hidden] { display: none !important; }

.navbar {
  position: sticky;
  top: 0;
  z-index: 10;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--erow-surface);
  box-shadow: 0 1px 4px rgba(0, 21, 41, 0.08);
}
.brand, .navbar-actions, .page-actions, .toolbar-actions, .pager, .dialog-actions {
  display: flex;
  align-items: center;
}
.brand { gap: 10px; font-size: 16px; font-weight: 600; }
.brand-mark {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  color: #fff;
  background: var(--erow-primary);
}
.navbar-actions { gap: 8px; color: var(--erow-text-muted); }
.navbar-button {
  height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 6px;
  color: inherit;
  background: transparent;
}
.navbar-button:hover { color: var(--erow-primary-active); background: var(--erow-primary-soft); }

.app-shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: calc(100vh - 50px); }
.sidebar {
  padding: 14px 12px;
  border-right: 1px solid var(--erow-border-soft);
  background: var(--erow-surface);
}
.nav-title { padding: 6px 12px; color: var(--erow-text-secondary); font-size: 12px; }
.nav-button {
  width: 100%;
  height: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  color: #636d7e;
  background: transparent;
  text-align: left;
}
.nav-button:hover, .nav-button.active { color: var(--erow-primary-active); background: var(--erow-primary-soft); }
.nav-button.active { font-weight: 600; box-shadow: inset 3px 0 var(--erow-primary); }
.nav-icon { width: 18px; height: 18px; }

.page { min-width: 0; padding: 20px; }
.page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
.page-heading h1 { margin: 0; font-size: 20px; line-height: 1.4; }
.page-heading p { margin: 4px 0 0; color: var(--erow-text-secondary); }
.page-actions, .toolbar-actions { gap: 10px; }

.tabs { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--erow-border); }
.tab {
  height: 38px;
  padding: 0 16px;
  border: 0;
  border-bottom: 2px solid transparent;
  color: #636d7e;
  background: transparent;
}
.tab:hover, .tab[aria-selected="true"] { color: var(--erow-primary-active); }
.tab[aria-selected="true"] { border-bottom-color: var(--erow-primary); font-weight: 600; }

.panel {
  min-width: 0;
  border: 1px solid var(--erow-border-soft);
  border-radius: var(--erow-radius-lg);
  background: var(--erow-surface);
}
.panel + .panel { margin-top: 14px; }
.panel-header {
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 18px;
  border-bottom: 1px solid var(--erow-border-soft);
}
.section-title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; line-height: 20px; }
.section-title::before {
  content: "";
  width: 3px;
  height: 20px;
  border-radius: 3px;
  background: var(--erow-primary);
}
.panel-body { min-width: 0; padding: 18px; }
.muted { color: var(--erow-text-secondary); }

.button {
  height: 32px;
  padding: 0 14px;
  border: 1px solid var(--erow-border);
  border-radius: 6px;
  color: var(--erow-text);
  background: var(--erow-surface);
}
.button:hover, .button:focus-visible { color: var(--erow-primary-active); border-color: var(--erow-primary); background: var(--erow-primary-soft); }
.button.primary { color: #fff; border-color: var(--erow-primary); background: var(--erow-primary); }
.button.primary:hover, .button.primary:focus-visible { color: #fff; border-color: var(--erow-primary-hover); background: var(--erow-primary-hover); }
.button.primary:active { border-color: var(--erow-primary-active); background: var(--erow-primary-active); }
.button.danger { color: #fff; border-color: var(--erow-danger); background: var(--erow-danger); }
.button:disabled { opacity: 0.48; }

.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.metric { min-height: 92px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 16px; }
.metric-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; color: #fff; }
.metric-icon svg { width: 22px; height: 22px; }
.metric-label { color: var(--erow-text-secondary); }
.metric-value { margin: 2px 0; font-size: 22px; font-weight: 600; }
.metric-compare { color: var(--erow-success); font-size: 12px; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 0.75fr); gap: 14px; }
.dashboard-grid .panel + .panel { margin-top: 0; }
.chart { width: 100%; height: 310px; overflow: hidden; }
.chart-state { height: 100%; display: grid; place-items: center; padding: 24px; color: var(--erow-text-muted); background: var(--erow-disabled-bg); text-align: center; }
.rank-list { display: grid; gap: 13px; }
.rank-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 48px; gap: 10px; align-items: center; }
.rank-number { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; color: var(--erow-primary-active); background: var(--erow-primary-soft); font-size: 12px; }
.rank-track { height: 6px; overflow: hidden; border-radius: 4px; background: var(--erow-disabled-bg); }
.rank-fill { height: 100%; border-radius: 4px; background: var(--erow-primary); }

.filters { display: grid; grid-template-columns: 2fr 1fr auto; gap: 14px; align-items: end; }
.field { display: grid; gap: 6px; }
.field label { color: #636d7e; }
.control {
  width: 100%;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--erow-border);
  border-radius: var(--erow-radius-sm);
  color: var(--erow-text);
  background: var(--erow-surface);
  outline: none;
}
textarea.control { min-height: 80px; padding: 8px 10px; resize: vertical; }
.control:focus { border-color: var(--erow-primary); box-shadow: 0 0 0 2px rgba(97, 178, 255, 0.16); }
.control.required-control { border-color: var(--erow-required-border); background: var(--erow-required-bg); }
.control.invalid { border-color: var(--erow-danger); background: #fff8f8; }
.filter-actions { display: flex; gap: 10px; }

.toolbar { min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 18px; border-bottom: 1px solid var(--erow-border-soft); }
.table-scroll { overflow-x: auto; }
table { width: 100%; min-width: 900px; border-collapse: collapse; table-layout: fixed; }
caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
th, td { height: 40px; padding: 0 10px; border-bottom: 1px solid var(--erow-border-soft); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
th { color: var(--erow-primary-active); background: var(--erow-table-head); font-weight: 600; }
tbody tr:hover { background: #fbfdff; }
.column-check { width: 48px; text-align: center; }
.column-status { width: 100px; }
.column-date { width: 160px; }
.column-actions { width: 130px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.success { color: #268b70; background: #edf9f5; }
.badge.warning { color: #b27416; background: #fff8eb; }
.badge.info { color: var(--erow-primary-active); background: var(--erow-primary-soft); }
.row-action { height: 28px; padding: 0 6px; border: 0; color: var(--erow-primary-active); background: transparent; }
.row-action:hover { text-decoration: underline; }
.empty-cell { height: 120px; color: var(--erow-text-secondary); text-align: center; }
.pager { justify-content: flex-end; gap: 8px; padding: 12px 18px; overflow-x: auto; }
.page-button { min-width: 30px; height: 30px; padding: 0 8px; border: 1px solid var(--erow-border-soft); border-radius: 4px; color: var(--erow-text); background: #f4f4f5; }
.page-button:hover, .page-button.active { color: #fff; border-color: var(--erow-primary); background: var(--erow-primary); }
.page-button:disabled { opacity: 0.45; }

.dialog-layer { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, 0.42); }
.dialog { width: min(680px, calc(100vw - 48px)); max-height: calc(100vh - 48px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-radius: var(--erow-radius-lg); background: var(--erow-surface); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.16); }
.dialog.compact { width: min(460px, calc(100vw - 48px)); }
.dialog-header { min-height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--erow-border-soft); }
.dialog-header h2 { margin: 0; font-size: 18px; }
.icon-button { width: 30px; height: 30px; border: 0; border-radius: 4px; color: var(--erow-text-muted); background: transparent; font-size: 22px; }
.icon-button:hover { color: var(--erow-primary-active); background: var(--erow-primary-soft); }
.dialog-body { overflow: auto; padding: 20px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
.span-2 { grid-column: 1 / -1; }
.required-label::before { content: "*"; margin-right: 4px; color: var(--erow-danger); }
.error-text { min-height: 18px; color: var(--erow-danger); font-size: 12px; }

/* Detail labels: scoped to the record form; query filters keep their own layout. */
#recordForm { --erow-label-width: 104px; }
#recordForm .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#recordForm .field { min-width: 0; display: grid; grid-template-columns: var(--erow-label-width) minmax(0, 1fr); align-items: start; gap: 4px 8px; }
#recordForm .field > label { grid-column: 1; grid-row: 1; padding-top: 6px; line-height: 20px; text-align: var(--erow-label-align, left); overflow-wrap: anywhere; }
#recordForm .field > .control { grid-column: 2; grid-row: 1; min-width: 0; }
#recordForm .field > .error-text { grid-column: 2; grid-row: 2; overflow-wrap: anywhere; }
#recordForm .required-control:not([readonly]):not(:disabled) { background: var(--erow-required-bg); border-color: var(--erow-required-border); }
#recordForm .control[readonly], #recordForm .control:disabled { opacity: 1; color: var(--erow-text); background: var(--erow-disabled-bg); border-color: var(--erow-border); }
#recordForm .control.invalid { border-color: var(--erow-danger); background: #fff6f6; }
#recordForm.form-view .required-label::before { content: none; }

.dialog-actions { justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--erow-border-soft); }
.toast { position: fixed; top: 66px; right: 20px; z-index: 80; padding: 10px 14px; border: 1px solid #b9ebdf; border-radius: 6px; color: #268b70; background: #edf9f5; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1); }

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid rgba(68, 156, 240, 0.42);
  outline-offset: 2px;
}

@media (max-width: 1500px) {
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dashboard-grid { grid-template-columns: minmax(0, 1fr) 340px; }
}
@media (max-width: 1280px) {
  .app-shell { grid-template-columns: 210px minmax(0, 1fr); }
  .dashboard-grid { grid-template-columns: 1fr; }
  .dashboard-grid .panel + .panel { margin-top: 0; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filter-actions { grid-column: 1 / -1; justify-content: flex-end; }
}
@media (prefers-reduced-motion: no-preference) {
  .button, .nav-button, .tab, .navbar-button { transition: color 0.16s ease, background 0.16s ease, border-color 0.16s ease; }
}

</style>
</head>
<body>
  <header class="navbar">
    <div class="brand"><span class="brand-mark">E</span><span>Erow 示例业务中心</span></div>
    <div class="navbar-actions"><button class="navbar-button">消息</button><button class="navbar-button">示例用户</button></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="nav-title">业务管理</div>
      <button class="nav-button active" data-tab-target="overview">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 13h6V4H4v9Zm10 7h6V11h-6v9ZM4 20h6v-3H4v3Zm10-13h6V4h-6v3Z"/></svg>
        数据总览
      </button>
      <button class="nav-button" data-tab-target="records">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
        示例记录
      </button>
    </aside>
    <main class="page">
      <header class="page-heading">
        <div><h1>示例业务管理</h1><p>查看虚构指标、趋势和待处理记录</p></div>
        <div class="page-actions"><button class="button">导出数据</button><button class="button primary" id="openCreate">新增记录</button></div>
      </header>
      <div class="tabs" role="tablist" aria-label="页面视图">
        <button class="tab" id="tab-overview" role="tab" aria-selected="true" aria-controls="overview">数据总览</button>
        <button class="tab" id="tab-records" role="tab" aria-selected="false" aria-controls="records">示例记录</button>
      </div>

      <section id="overview" role="tabpanel" aria-labelledby="tab-overview">
        <div class="metrics" id="metricGrid"></div>
        <div class="dashboard-grid">
          <section class="panel">
            <header class="panel-header"><h2 class="section-title">近半年示例趋势</h2><span class="muted">单位：条</span></header>
            <div class="panel-body"><div id="trendChart" class="chart" aria-label="近半年示例趋势图"></div></div>
          </section>
          <section class="panel">
            <header class="panel-header"><h2 class="section-title">区域完成排行</h2><span class="muted">本月</span></header>
            <div class="panel-body rank-list" id="rankList"></div>
          </section>
        </div>
      </section>

      <section id="records" role="tabpanel" aria-labelledby="tab-records" hidden>
        <section class="panel">
          <div class="panel-body">
            <form class="filters" id="filterForm">
              <div class="field"><label for="keyword">关键词</label><input class="control" id="keyword" placeholder="输入示例编号或名称"></div>
              <div class="field"><label for="statusFilter">状态</label><select class="control" id="statusFilter"><option value="">全部状态</option><option>进行中</option><option>待处理</option><option>已完成</option></select></div>
              <div class="filter-actions"><button class="button" type="button" id="resetFilter">重置</button><button class="button primary" type="submit">查询</button></div>
            </form>
          </div>
        </section>
        <section class="panel">
          <div class="toolbar"><div class="toolbar-actions"><strong id="resultCount">共 0 条</strong><button class="button primary" id="batchDelete" disabled>批量删除</button></div><button class="button" type="button">导出列表</button></div>
          <div class="table-scroll">
            <table>
              <caption>虚构示例记录列表</caption>
              <thead><tr><th class="column-check" scope="col"><input id="selectPage" type="checkbox" aria-label="选择当前页"></th><th scope="col">记录编号</th><th scope="col">记录名称</th><th scope="col">示例区域</th><th scope="col">示例负责人</th><th class="column-status" scope="col">状态</th><th class="column-date" scope="col">更新时间</th><th class="column-actions" scope="col">操作</th></tr></thead>
              <tbody id="recordBody"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </section>
      </section>
    </main>
  </div>

  <div class="dialog-layer" id="dialogLayer" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <header class="dialog-header"><h2 id="dialogTitle">新增示例记录</h2><button class="icon-button" id="closeDialog" aria-label="关闭弹窗">×</button></header>
      <form id="recordForm" novalidate>
        <div class="dialog-body">
          <div class="form-grid">
            <div class="field"><label class="required-label" for="recordName">记录名称</label><input class="control required-control" required aria-required="true" id="recordName" name="recordName" aria-describedby="recordNameError"><div class="error-text" id="recordNameError" aria-live="polite"></div></div>
            <div class="field"><label class="required-label" for="region">示例区域</label><select class="control required-control" required aria-required="true" id="region" name="region" aria-describedby="regionError"><option value="">请选择区域</option><option>示例区域 A</option><option>示例区域 B</option><option>示例区域 C</option></select><div class="error-text" id="regionError" aria-live="polite"></div></div>
            <div class="field"><label class="required-label" for="owner">示例负责人</label><input class="control required-control" required aria-required="true" id="owner" name="owner" aria-describedby="ownerError"><div class="error-text" id="ownerError" aria-live="polite"></div></div>
            <div class="field"><label for="recordStatus">初始状态</label><select class="control" id="recordStatus" name="recordStatus"><option>待处理</option><option>进行中</option><option>已完成</option></select><div class="error-text"></div></div>
            <div class="field span-2"><label for="remark">备注</label><textarea class="control" id="remark" name="remark" placeholder="填写虚构示例说明"></textarea><div class="error-text"></div></div>
          </div>
        </div>
        <footer class="dialog-actions"><button class="button" type="button" id="cancelDialog">取消</button><button class="button primary" type="submit" id="submitRecord">保存记录</button></footer>
      </form>
    </section>
  </div>

  <div class="dialog-layer" id="confirmLayer" hidden>
    <section class="dialog compact" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <header class="dialog-header"><h2 id="confirmTitle">确认删除</h2><button class="icon-button" id="closeConfirm" aria-label="关闭确认弹窗">×</button></header>
      <div class="dialog-body"><p id="confirmMessage">删除后将无法从当前原型中恢复，是否继续？</p></div>
      <footer class="dialog-actions"><button class="button" id="cancelConfirm">取消</button><button class="button danger" id="acceptConfirm">确认删除</button></footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
const appData = {
  metrics: [
    { label: "本月示例记录", value: "1,286", compare: "较上月增加 8.6%", color: "#61b2ff" },
    { label: "任务完成率", value: "86.4%", compare: "较上月增加 4.2%", color: "#30b08f" },
    { label: "待处理事项", value: "36", compare: "较昨日减少 5 条", color: "#fec171" },
    { label: "示例服务点", value: "128", compare: "本月新增 6 个", color: "#8291a9" }
  ],
  trend: {
    months: ["3月", "4月", "5月", "6月", "7月", "8月"],
    created: [132, 148, 162, 179, 188, 211],
    completed: [118, 139, 151, 168, 176, 198]
  },
  rankings: [
    { name: "示例区域 A", value: 96 },
    { name: "示例区域 B", value: 89 },
    { name: "示例区域 C", value: 82 },
    { name: "示例区域 D", value: 74 },
    { name: "示例区域 E", value: 68 }
  ],
  records: [
    { id: "SAMPLE-0001", name: "虚构巡检任务", region: "示例区域 A", owner: "示例用户甲", status: "进行中", updated: "2026-08-17 10:24" },
    { id: "SAMPLE-0002", name: "虚构指标复核", region: "示例区域 B", owner: "示例用户乙", status: "待处理", updated: "2026-08-17 09:18" },
    { id: "SAMPLE-0003", name: "虚构数据归档", region: "示例区域 C", owner: "示例用户丙", status: "已完成", updated: "2026-08-16 17:42" },
    { id: "SAMPLE-0004", name: "虚构质量抽检", region: "示例区域 A", owner: "示例用户丁", status: "进行中", updated: "2026-08-16 15:08" },
    { id: "SAMPLE-0005", name: "虚构任务回访", region: "示例区域 B", owner: "示例用户戊", status: "待处理", updated: "2026-08-16 13:36" },
    { id: "SAMPLE-0006", name: "虚构数据校验", region: "示例区域 C", owner: "示例用户己", status: "已完成", updated: "2026-08-15 18:10" },
    { id: "SAMPLE-0007", name: "虚构事项跟进", region: "示例区域 A", owner: "示例用户庚", status: "进行中", updated: "2026-08-15 14:22" }
  ]
};

const state = {
  activeTab: "overview",
  keyword: "",
  status: "",
  page: 1,
  pageSize: 5,
  selected: new Set(),
  chart: null,
  lastFocus: null,
  pendingDelete: null
};

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];

function metricIcon() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>';
}

function renderMetrics() {
  $("#metricGrid").innerHTML = appData.metrics.map((metric) => `
    <article class="panel metric">
      <div class="metric-icon" style="background:${metric.color}">${metricIcon()}</div>
      <div><div class="metric-label">${metric.label}</div><div class="metric-value">${metric.value}</div><div class="metric-compare">${metric.compare}</div></div>
    </article>`).join("");
}

function renderRanks() {
  $("#rankList").innerHTML = appData.rankings.map((item, index) => `
    <div class="rank-row">
      <span class="rank-number">${index + 1}</span>
      <div><div>${item.name}</div><div class="rank-track"><div class="rank-fill" style="width:${item.value}%"></div></div></div>
      <strong>${item.value}%</strong>
    </div>`).join("");
}

function initChart() {
  const chartElement = $("#trendChart");
  if (!window.echarts) {
    chartElement.innerHTML = '<div class="chart-state"><div><strong>图表暂时不可用</strong><br>未加载 ECharts。联网刷新或改为本地引入 echarts.min.js。</div></div>';
    return;
  }
  state.chart = window.echarts.init(chartElement);
  state.chart.setOption({
    color: ["#61b2ff", "#30b08f"],
    tooltip: { trigger: "axis" },
    legend: { data: ["新增记录", "已完成"] },
    grid: { left: 44, right: 18, top: 46, bottom: 32 },
    xAxis: { type: "category", data: appData.trend.months, axisLine: { lineStyle: { color: "#dcdfe6" } } },
    yAxis: { type: "value", splitLine: { lineStyle: { color: "#ebeef5", type: "dashed" } } },
    series: [
      { name: "新增记录", type: "bar", barWidth: 14, data: appData.trend.created, itemStyle: { borderRadius: [4, 4, 0, 0] } },
      { name: "已完成", type: "bar", barWidth: 14, data: appData.trend.completed, itemStyle: { borderRadius: [4, 4, 0, 0] } }
    ]
  });
}

function switchTab(id) {
  state.activeTab = id;
  $$(".tab").forEach((tab) => tab.setAttribute("aria-selected", String(tab.getAttribute("aria-controls") === id)));
  $$('[role="tabpanel"]').forEach((panel) => { panel.hidden = panel.id !== id; });
  $$(".nav-button").forEach((button) => button.classList.toggle("active", button.dataset.tabTarget === id));
  if (id === "overview" && state.chart) setTimeout(() => state.chart.resize(), 0);
}

function filteredRows() {
  const keyword = state.keyword.toLowerCase();
  return appData.records.filter((record) => {
    const matchesKeyword = !keyword || `${record.id}${record.name}`.toLowerCase().includes(keyword);
    return matchesKeyword && (!state.status || record.status === state.status);
  });
}

function statusClass(status) {
  if (status === "已完成") return "success";
  if (status === "待处理") return "warning";
  return "info";
}

function renderTable() {
  const rows = filteredRows();
  const totalPages = Math.max(1, Math.ceil(rows.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const visibleRows = rows.slice((state.page - 1) * state.pageSize, state.page * state.pageSize);
  $("#resultCount").textContent = `共 ${rows.length} 条`;
  $("#recordBody").innerHTML = visibleRows.length ? visibleRows.map((record) => `
    <tr tabindex="0" data-record-id="${record.id}">
      <td class="column-check"><input class="row-check" type="checkbox" value="${record.id}" aria-label="选择 ${record.id}" ${state.selected.has(record.id) ? "checked" : ""}></td>
      <td title="${record.id}">${record.id}</td><td title="${record.name}">${record.name}</td><td>${record.region}</td><td>${record.owner}</td>
      <td><span class="badge ${statusClass(record.status)}">${record.status}</span></td><td>${record.updated}</td>
      <td><button class="row-action" data-edit="${record.id}">编辑</button><button class="row-action" data-remove="${record.id}">删除</button></td>
    </tr>`).join("") : '<tr><td class="empty-cell" colspan="8">暂无匹配记录，请调整条件或重置查询。</td></tr>';
  const selectPage = $("#selectPage");
  selectPage.checked = visibleRows.length > 0 && visibleRows.every((record) => state.selected.has(record.id));
  selectPage.indeterminate = visibleRows.some((record) => state.selected.has(record.id)) && !selectPage.checked;
  $("#batchDelete").disabled = state.selected.size === 0;
  renderPager(totalPages);
}

function renderPager(totalPages) {
  let html = `<span class="muted">第 ${state.page}/${totalPages} 页</span><button class="page-button" data-page="${state.page - 1}" ${state.page === 1 ? "disabled" : ""}>‹</button>`;
  for (let page = 1; page <= totalPages; page += 1) html += `<button class="page-button ${page === state.page ? "active" : ""}" data-page="${page}">${page}</button>`;
  html += `<button class="page-button" data-page="${state.page + 1}" ${state.page === totalPages ? "disabled" : ""}>›</button>`;
  $("#pager").innerHTML = html;
}

function showToast(message) {
  const toast = $("#toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => { toast.hidden = true; }, 2600);
}

function clearErrors() {
  $$(".invalid").forEach((control) => { control.classList.remove("invalid"); control.removeAttribute("aria-invalid"); });
  $$(".error-text").forEach((message) => { message.textContent = ""; });
}

function openDialog(record, view = false) {
  state.lastFocus = document.activeElement;
  $("#dialogTitle").textContent = view ? "查看示例记录" : (record ? "编辑示例记录" : "新增示例记录");
  $("#recordForm").reset();
  $("#recordForm").dataset.editId = record?.id || "";
  $("#recordForm").dataset.mode = view ? "view" : (record ? "edit" : "create");
  $("#recordForm").classList.toggle("form-view", view);
  ["recordName", "owner", "remark"].forEach(id => { $("#" + id).readOnly = view; });
  ["region", "recordStatus"].forEach(id => { $("#" + id).disabled = view; });
  $("#submitRecord").hidden = view;
  $("#cancelDialog").textContent = view ? "关闭" : "取消";
  $("#remark").placeholder = view ? "" : "填写虚构示例说明";
  if (record) {
    $("#recordName").value = record.name;
    $("#region").value = record.region;
    $("#owner").value = record.owner;
    $("#recordStatus").value = record.status;
    $("#remark").value = record.remark || "";
  }
  clearErrors();
  $("#dialogLayer").hidden = false;
  document.body.style.overflow = "hidden";
  $(view ? "#cancelDialog" : "#recordName").focus();
}

function closeDialog() {
  $("#dialogLayer").hidden = true;
  document.body.style.overflow = "";
  state.lastFocus?.focus();
}

function openConfirm(ids, message) {
  state.lastFocus = document.activeElement;
  state.pendingDelete = ids;
  $("#confirmMessage").textContent = message;
  $("#confirmLayer").hidden = false;
  document.body.style.overflow = "hidden";
  setTimeout(() => $("#acceptConfirm").focus(), 0);
}

function closeConfirm() {
  $("#confirmLayer").hidden = true;
  state.pendingDelete = null;
  document.body.style.overflow = "";
  state.lastFocus?.focus();
}

function trapDialogFocus(event, layer) {
  if (event.key !== "Tab" || layer.hidden) return;
  const controls = [...layer.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter((control) => !control.disabled);
  if (!controls.length) return;
  const first = controls[0];
  const last = controls[controls.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

function validateRecord() {
  clearErrors();
  const rules = [
    ["recordName", "recordNameError", "请输入记录名称"],
    ["region", "regionError", "请选择示例区域"],
    ["owner", "ownerError", "请输入示例负责人"]
  ];
  let firstInvalid = null;
  rules.forEach(([controlId, errorId, message]) => {
    const control = $(`#${controlId}`);
    if (!control.value.trim()) {
      control.classList.add("invalid"); control.setAttribute("aria-invalid", "true");
      $(`#${errorId}`).textContent = message;
      firstInvalid ||= control;
    }
  });
  firstInvalid?.focus();
  return !firstInvalid;
}

function saveRecord() {
  if ($("#recordForm").dataset.mode === "view") return;
  const editId = $("#recordForm").dataset.editId;
  const record = {
    name: $("#recordName").value.trim(),
    region: $("#region").value,
    owner: $("#owner").value.trim(),
    status: $("#recordStatus").value,
    remark: $("#remark").value.trim(),
    updated: "2026-08-17 刚刚"
  };
  if (editId) Object.assign(appData.records.find((item) => item.id === editId), record);
  else appData.records.unshift({ id: `SAMPLE-${String(appData.records.length + 1).padStart(4, "0")}`, ...record });
  renderTable();
  closeDialog();
  showToast(editId ? "示例记录已更新" : "示例记录已创建");
}

$$(".tab").forEach((tab) => tab.addEventListener("click", () => switchTab(tab.getAttribute("aria-controls"))));
$$(".nav-button").forEach((button) => button.addEventListener("click", () => switchTab(button.dataset.tabTarget)));
$("#openCreate").addEventListener("click", () => openDialog());
$("#filterForm").addEventListener("submit", (event) => { event.preventDefault(); state.keyword = $("#keyword").value.trim(); state.status = $("#statusFilter").value; state.page = 1; renderTable(); });
$("#resetFilter").addEventListener("click", () => { $("#filterForm").reset(); state.keyword = ""; state.status = ""; state.page = 1; renderTable(); });
$("#recordBody").addEventListener("change", (event) => { if (event.target.matches(".row-check")) { if (event.target.checked) state.selected.add(event.target.value); else state.selected.delete(event.target.value); renderTable(); } });
function viewRecordRow(event) {
  if (event.target.closest('button, a, input, select, textarea')) return;
  const row = event.target.closest('tr[data-record-id]');
  if (!row || (event.type === 'keydown' && (event.key !== 'Enter' || event.target !== row))) return;
  const record = appData.records.find(item => item.id === row.dataset.recordId);
  if (record) { event.preventDefault(); row.focus(); openDialog(record, true); }
}
$("#recordBody").addEventListener("dblclick", viewRecordRow);
$("#recordBody").addEventListener("keydown", viewRecordRow);
$("#recordBody").addEventListener("click", (event) => { const editId = event.target.dataset.edit; const removeId = event.target.dataset.remove; if (editId) openDialog(appData.records.find((record) => record.id === editId)); if (removeId) openConfirm([removeId], `确认删除示例记录 ${removeId}？删除后无法从当前原型恢复。`); });
$("#selectPage").addEventListener("change", (event) => { filteredRows().slice((state.page - 1) * state.pageSize, state.page * state.pageSize).forEach((record) => { if (event.target.checked) state.selected.add(record.id); else state.selected.delete(record.id); }); renderTable(); });
$("#batchDelete").addEventListener("click", () => openConfirm([...state.selected], `确认删除已选择的 ${state.selected.size} 条示例记录？`));
$("#pager").addEventListener("click", (event) => { if (event.target.dataset.page && !event.target.disabled) { state.page = Number(event.target.dataset.page); renderTable(); } });
$("#closeDialog").addEventListener("click", closeDialog);
$("#cancelDialog").addEventListener("click", closeDialog);
$("#dialogLayer").addEventListener("mousedown", (event) => { if (event.target === event.currentTarget) closeDialog(); });
$("#recordForm").addEventListener("submit", (event) => { event.preventDefault(); if ($("#recordForm").dataset.mode === "view" || !validateRecord()) return; const button = $("#submitRecord"); button.disabled = true; button.textContent = "保存中…"; setTimeout(() => { saveRecord(); button.disabled = false; button.textContent = "保存记录"; }, 350); });
$("#closeConfirm").addEventListener("click", closeConfirm);
$("#cancelConfirm").addEventListener("click", closeConfirm);
$("#confirmLayer").addEventListener("mousedown", (event) => { if (event.target === event.currentTarget) closeConfirm(); });
$("#acceptConfirm").addEventListener("click", () => { const ids = new Set(state.pendingDelete || []); appData.records = appData.records.filter((record) => !ids.has(record.id)); ids.forEach((id) => state.selected.delete(id)); $("#confirmLayer").hidden = true; state.pendingDelete = null; document.body.style.overflow = ""; renderTable(); showToast(ids.size > 1 ? "所选示例记录已删除" : "示例记录已删除"); state.lastFocus?.focus(); });
document.addEventListener("keydown", (event) => { trapDialogFocus(event, $("#dialogLayer")); trapDialogFocus(event, $("#confirmLayer")); if (event.key === "Escape" && !$("#confirmLayer").hidden) closeConfirm(); else if (event.key === "Escape" && !$("#dialogLayer").hidden) closeDialog(); });

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => state.chart?.resize(), 120); });

renderMetrics();
renderRanks();
renderTable();
initChart();

</script>
</body>
</html>
