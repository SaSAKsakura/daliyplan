<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title></title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0px;
        padding: 0px;
      }

      body {
        background: url(../Images/Main/welcome.jpg) center center no-repeat;
        background-size: 100% 100%;
      }

      img {
        width: 100%;
        height: 100%;
      }
      #overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 100;
      }

      #modal {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
        padding: 25px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        z-index: 101;
      }

      .modal-title {
        margin: 0 0 20px 0;
        font-size: 18px;
        color: #333;
      }

      .select-group {
        display: flex;
        align-items: center;
        margin-bottom: 30px;
      }

      .select-label {
        margin-right: 10px;
        font-size: 14px;
        color: #666;
        white-space: nowrap;
      }

      .select-label::before {
        content: "*";
        color: red;
        margin-right: 4px;
      }

      .custom-dropdown {
        position: relative;
        width: 300px;
        font-family: "Arial", sans-serif;
      }
      .dropdown-header {
        padding: 7px 15px;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        transition: border-color 0.3s;
      }
      .dropdown-header:hover {
        border-color: #c0c4cc;
      }
      .dropdown-header.active {
        border-color: #61b2ff;
      }
      .dropdown-arrow {
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 6px solid #666;
        transition: transform 0.3s;
      }
      .dropdown-arrow.open {
        transform: rotate(180deg);
      }
      .dropdown-list {
        position: absolute;
        width: 100%;
        max-height: 200px;
        overflow-y: auto;
        margin-top: 5px;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        display: none;
        z-index: 1000;
      }
      .dropdown-item {
        padding: 10px 15px;
        cursor: pointer;
        color: #1a1a1a;
        transition: background 0.2s;
      }
      .dropdown-item:hover {
        background: #f7f7f7;
      }
      .dropdown-item.selected {
        color: #61b2ff;
        background: #f0f7ff;
      }
      .loading-text {
        padding: 10px 15px;
        color: #999999;
        text-align: center;
      }

      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .modal-btn {
        padding: 8px 20px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
      }

      .apply-btn {
        background: #61b2ff;
        color: white;
        border: none;
      }

      .cancel-btn {
        background: #fff;
        color: #1a1a1a;
        border: 1px solid #ddd;
      }
    </style>
    <script src="../APP/libs/js/jquery-3.1.0.min.js"></script>
    <script src="../js/android.js"></script>
    <script src="../js/config.js"></script>
    <script src="../SelfDefineProject/entranceJS/index.js"></script>
    <script src="../APP/config/index.js"></script>
    <script src="../APP/tools/erPageController.js"></script>
    <script src="../APP/tools/erRequest.js"></script>
    <script src="../APP/libs/js/encrypt/sm2.js"></script>

    <script>
      function onDataReady() {
        console.log(_Token);
        console.log(_UserName);
        if (
          _Token == "" ||
          _UserName == "" ||
          _Token == undefined ||
          _Token == null ||
          _UserName == undefined ||
          _UserName == null
        ) {
          alert("用户登录信息有误,请重新验证");
          window.location.href = "../SignIn.html?temp=" + new Date().getTime();
        } else {
          // getDataMasterList();
          this.goDefault();
        }
      }
      function decryptsm2(content, privateKey) {
        content = content.slice(2);
        let decryptData = sm2.doDecrypt(content, privateKey, 0);
        return decryptData;
      }
      function loadConfig(params, cb) {
        var url2 = params.url;
        if(!url2){
          cb();
          return;
        }
        let token = _Token;
        //在引入的主入口js中已定义
        let currentConfigKey=localStorage.getItem("currentConfigKey");
        var BASE_CONFIG = localStorage.getItem(currentConfigKey+"BASE_CONFIG");
        BASE_CONFIG = BASE_CONFIG ? JSON.parse(BASE_CONFIG) : {};
        let data = {
          serverName:BASE_CONFIG.systemCode, //project_name
        };
        $.ajax({
          url: url2,
          type: "post",
          dataType: "json",
          headers: {
            "content-type": "application/json;charset=utf-8",
            Authorization: _Token,
          },
          data: JSON.stringify(data),
          async: true,
          success: function (res) {
            if (res.code !== "SUCCESS") {
              cb();
              return;
            } else {
              if (res.data) {
                let temp = JSON.parse(
                  decryptsm2(res.data.random1, res.data.random2)
                );
                //用线上变的配置覆盖本地的配置，如baseUrl
                temp=Object.assign(BASE_CONFIG, temp);

                //先清除本地所有的项目配置，避免占用内存
                Object.keys(localStorage).forEach((key) => {
                  if (key.indexOf("BASE_CONFIG") !== -1) {
                    localStorage.removeItem(key);
                  }
                });
                localStorage.setItem("currentConfigKey", temp.projectPath);
                localStorage.setItem(
                  temp.projectPath + "BASE_CONFIG",
                  JSON.stringify(temp)
                );
              }
              cb();
            }
          },
          error: function (res) {
            cb();
          },
        });
      }
      function loadScrpit(url) {}
      function goPage() {
        console.log("goPage");
        let pageParams = pageManager.getPageParams();
        let defaultPageUrl = "../APP/template/Default.html?isFirst=true";
        let goDefaultPage = function () {
          window.location.href = defaultPageUrl;
        };
        let getAppMenuData = function (successCb) {
          let url =
            baseUrl + erowplatformBackendUrl + "/appBaseApi/getAppMenuData";
          $.ajax({
            url: url,
            type: "post",
            headers: {
              Authorization: _Token,
            },
            async: true,
            success: function (res) {
              if (res.code !== "SUCCESS") {
                this.$toast.fail(res.msg);
                return;
              }
              successCb.call(this, res.data || []);
            },
            error: function (res) {
              this.$toast.fail(res.msg);
            },
          });
        };
        let getPageUrl = function (page_url) {
          let index = page_url.indexOf("Entrance.html");
          let pageUrl = "";
          if(index>-1){
            pageUrl = "../APP/template/" + page_url.substring(index);
          }else{
            pageUrl = "../APP/template/" + page_url;
          }
          return pageUrl;
        };
        if (pageParams.fromOther == -1) {
          //从其他应用跳转
          //获取菜单列表
          if (pageParams.target_menu_id) {
            getAppMenuData(function (menuData) {
              let menuInfo = menuData.find((item) => {
                return item.menu_id == pageParams.target_menu_id;
              });
              let pageUrl = getPageUrl(menuInfo.page_url);
              pageManager.replace(pageUrl, {
                ...menuInfo,
                ...{ fromOther: -1 },
              });
            });
          } else if (pageParams.fnCode) {
            getAppMenuData(function (menuData) {
              let menuInfo = menuData.find((item) => {
                return (
                  item.fn_code == pageParams.fnCode &&
                  item.fn_parameter == pageParams.fnParameter
                );
              });
              if (!menuInfo) {
                // this.$toast.fail("跳转菜单无权限，默认跳转首页");
                console.log("跳转菜单无权限，默认跳转首页");
                goDefaultPage();
                return;
              }
              // let pageUrl = "../APP" + menuInfo.page_url.substring(2);
              //let pageUrl = getPageUrl(menuInfo.page_url);
               // menuInfo.page_url 是相对于 APP/template/ 的路径，当前页面在 Main/SS.html，需要转换基准
              let pageUrl = convertPath(menuInfo.page_url);
              pageManager.replace(pageUrl, {
                ...menuInfo,
                ...{ fromOther: -1 },
                ...pageParams,
              });
            });
          } else {
            goDefaultPage();
          }
        } else {
          goDefaultPage();
        }
      }
      function getRelativePath(from, to) {
        var fromParts = from.replace(/\/$/, '').split('/');
        var toParts = to.replace(/\/$/, '').split('/');
        var common = 0;
        while (common < fromParts.length && common < toParts.length &&
               fromParts[common] === toParts[common]) {
          common++;
        }
        var upCount = fromParts.length - common;
        var downParts = toParts.slice(common);
        var result = '';
        for (var i = 0; i < upCount; i++) {
          result += '../';
        }
        return result + downParts.join('/');
      }

      function convertPath(page_url) {
        var currentHref = window.location.href;
        var mainIndex = currentHref.indexOf('/Main/');
        if (mainIndex === -1) return page_url;

        // 构造 APP/template/ 的完整 file URL 作为基准
        var templateBase = currentHref.substring(0, mainIndex) + '/APP/template/';

        // 用 URL 对象解析 page_url（基于 file URL 也能正确解析）
        var resolved = new URL(page_url, templateBase);

        // 当前页面所在目录的 pathname（纯路径，不含 origin）
        var currentPath = window.location.pathname;
        var currentDir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);

        // 计算从 currentDir 到 resolved.pathname 的相对路径
        return getRelativePath(currentDir, resolved.pathname);
      }
      //界面跳转
      function goDefault() {
        //判断是否从另一个系统跳转
        appGetParameter("frontend_config", function (res) {
          if (res.result.value) {
            let params = res.result.value ? JSON.parse(decodeURIComponent(res.result.value)) : {};
            if (params.url) {
              loadConfig(params, goPage);
            } else {
              goPage();
            }
          } else {
            goPage();
          }
        });
      }
      function closeForm() {
        closeModal();
        appExitToYJK();
      }
      var dataMasterList = [];
      // 获取数据主人列表
      function getDataMasterList() {
        let url = baseUrl + "/token-manager/user/getDataMasterList";
        $.ajax({
          url: url,
          type: "post",
          headers: {
            Authorization: _Token,
          },
          async: true,
          success: function (res) {
            if (!res || res.code !== "SUCCESS") {
              return goDefault();
            }

            if (res.data) {
              let { currrentEstab, useDataMaster, estabList } = res.data;
              if (!useDataMaster) {
                return goDefault();
              }

              dataMasterList = estabList;

              appSetParameter(
                "userDataMasterList",
                encodeURIComponent(JSON.stringify(estabList)),
                function (res) {}
              );

              if (!currrentEstab) {
                return showModal();
              }

              let estab = null;
              if (Array.isArray(estabList)) {
                estab = estabList.find(
                  (item) => currrentEstab === item.row_guid
                );
              }
              if (!estab) {
                return showModal();
              }

              appSetParameter(
                "currentDataMaster",
                estab.estab_name,
                function (res) {
                  goDefault();
                }
              );
            } else {
              goDefault();
            }
          },
          error: function (res) {
            goDefault();
          },
        });
      }
      var dropdown;
      var header;
      var selectedText;
      var arrow;
      var list;

      document.addEventListener("DOMContentLoaded", function () {
        dropdown = document.querySelector(".custom-dropdown");
        header = dropdown.querySelector(".dropdown-header");
        selectedText = dropdown.querySelector(".selected-text");
        arrow = dropdown.querySelector(".dropdown-arrow");
        list = dropdown.querySelector(".dropdown-list");

        // 点击头部切换下拉框显示
        header.addEventListener("click", function () {
          const isOpen = list.style.display === "block";
          list.style.display = isOpen ? "none" : "block";
          arrow.classList.toggle("open");
          header.classList.toggle("active");
        });
        // 点击外部关闭下拉框
        document.addEventListener("click", function (e) {
          if (!dropdown.contains(e.target)) {
            list.style.display = "none";
            arrow.classList.remove("open");
            header.classList.remove("active");
          }
        });
      });
      function renderOptions() {
        list.innerHTML = "";
        dataMasterList.forEach((item) => {
          const option = document.createElement("div");
          option.className = "dropdown-item";
          option.textContent = item.estab_name;
          option.dataset.value = item.estab_id;
          list.appendChild(option);

          option.addEventListener("click", function () {
            selectedText.textContent = item.estab_name;
            header.classList.remove("active");
            list.style.display = "none";
            arrow.classList.remove("open");

            // 移除之前选中的样式
            document.querySelectorAll(".dropdown-item").forEach((opt) => {
              opt.classList.remove("selected");
            });
            // 添加当前选中样式
            this.classList.add("selected");
          });
        });
      }

      function showModal() {
        renderOptions();
        document.getElementById("overlay").style.display = "block";
        document.getElementById("modal").style.display = "block";
      }

      function closeModal() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("modal").style.display = "none";
      }

      // 设置当前数据主人

      function applyAction() {
        const selectedLabel = selectedText.textContent;
        if (!selectedLabel) {
          alert("请选择数据主人");
          return;
        }
        const selectedValue = dataMasterList.filter((el) => {
          return el.estab_name == selectedLabel;
        })[0].row_guid;

        var params = {
          row_guid: selectedValue,
        };
        let url = baseUrl + "/token-manager/user/setDataMaster";
        $.ajax({
          url: url,
          type: "post",
          contentType: "application/json",
          headers: {
            Authorization: _Token,
          },
          data: JSON.stringify(params),
          async: true,
          success: function (res) {
            closeModal();
            if (res.code !== "SUCCESS") {
              goDefault();
              return;
            }
            appSetParameter("currentDataMaster", selectedLabel, function (res) {
              goDefault();
            });
          },
          error: function (res) {
            closeModal();
            goDefault();
          },
        });
      }
    </script>

  <body>
    <div>
      <div id="overlay"></div>
      <div id="modal">
        <h2 class="modal-title">请选择数据主人</h2>
        <div class="select-group">
          <span class="select-label">数据主人</span>
          <div class="custom-dropdown">
            <div class="dropdown-header">
              <span class="selected-text">请选择</span>
              <div class="dropdown-arrow"></div>
            </div>
            <div class="dropdown-list">
              <div class="loading-text">加载中...</div>
            </div>
          </div>
        </div>
        <div class="modal-buttons">
          <button class="modal-btn apply-btn" onclick="applyAction()">
            应用
          </button>
          <button class="modal-btn cancel-btn" onclick="closeForm()">
            取消
          </button>
        </div>
      </div>
    </div>
  </body>
