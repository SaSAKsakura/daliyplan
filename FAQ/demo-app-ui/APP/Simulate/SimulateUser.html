<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模拟用户</title>
    <link rel="stylesheet" href="../assets/css/erow.css" />
    <link rel="stylesheet" href="../libs/css/vant.css" />
    <link rel="stylesheet" href="../assets/css/index.css" />
    <style>
      .flexPage {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .main {
        flex: 1;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        padding: 15px;
      }

      .searchBanner .van-search.van-search--show-action {
        padding: 0 0 15px;
      }

      .van-search__action {
        padding-right: 0;
      }

      .userList {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      .buttonPannel .blueBtn {
        margin-top: 15px;
        flex: 1;
      }

      .van-radio-group .van-radio:not(:nth-child(1)) {
        margin-top: 15px;
      }

      .van-empty__image {
        height: auto;
      }
      .oneUser {
        display: flex;
        flex-direction: column;
        justify-content: center;
        font-size: 14px;
        line-height: 18px;
      }
    </style>
  </head>

  <body>
    <div id="app" class="flexPage" v-cloak>
      <div class="head-nav-container">
        <span class="head-left back" @click="closeForm()">
          <img src="../assets/images/common/back-white.png" class="leftIcon back-image-unset" />
        </span>
        <span class="head-title">模拟用户</span>
      </div>
      <div class="main bg-white">
        <div class="searchBanner">
          <form action="/">
            <van-search v-model="userName" show-action placeholder="请输入姓名或账号" @search="onSearch" @cancel="onCancel" />
          </form>
        </div>
        <div class="userList">
          <template v-if="userList.length">
            <van-radio-group v-model="checkedUser">
              <van-radio checked-color="#3076FF" icon-size="14px" v-for="(user,index) in userList" :key="index" :name="user.row_guid">
                <template #default>
                  <div class="oneUser">
                    <span> 姓名： {{user.nativeName}} </span>
                    <span> 所属公司： {{ user.company }} </span>
                  </div>
                </template>
              </van-radio>
            </van-radio-group>
          </template>
          <van-empty class="empty-image" v-show="!userList.length" :image="window.PAGE_CONFIG.emptyListImage" description="暂无数据"> </van-empty>
        </div>
        <div class="buttonPannel flexAlignCenter bg-white">
          <van-button type="info" round size="small" class="blueBtn flex1" @click="simulate">切换</van-button>
        </div>
      </div>
    </div>
    <script src="../libs/js/jquery-3.1.0.min.js" type="text/javascript"></script>
    <script src="../config/index.js"></script>
    <script src="../tools/index.js"></script>
    <script src="../libs/js/Vue.js"></script>
    <script src="../libs/js/vant.min.js"></script>
    <script src="../utils/erowConfig.js"></script>
    <script type="text/javascript">
      function closeForm() {
        pageManager.back();
      }
      let vm = new Vue({
        el: "#app",
        data() {
          return {
            userName: "",
            userList: [
              {
                nativeName: "冯秋娜",
                company: "上海逸舟",
              },
            ],
            checkedUser: "",
            timer: null,
          };
        },
        methods: {
          closeForm() {
            closeForm();
          },
          onSearch() {
            let _this = this;
            this.$toast.loading({
              duration: 0,
              message: "数据加载中",
            });
            let url = ServerPathPost + "common/commonUser/getUserByName";
            let params = {
              nativeName: this.userName,
            };
            $.ajax({
              url: url,
              type: "post",
              data: JSON.stringify(params),
              contentType: "application/json",
              headers: { Authorization: erUser.token },
              success: (res) => {
                if (res.code == "SUCCESS" && res.data) {
                  _this.userList = res.data;
                  _this.$toast.clear();
                }
              },
              error: function (res) {},
            });
          },
          onCancel() {
            this.userList = [];
          },
          simulate() {
            if (!this.checkedUser) {
              this.$toast.fail("请先选择人员！");
              return;
            }
            let url = ServerPathPost + "token-manager/simulateLogin";
            let params = {
              loginType: "mobile",
              rowGuid: this.checkedUser,
              mobileType: "",
              appVersionNumber: "",
              uniqueId: "",
            };
            $.ajax({
              url: url,
              type: "post",
              data: JSON.stringify(params),
              contentType: "application/json",
              headers: { Authorization: erUser.token },
              success: (res) => {
                if (res.code == "SUCCESS") {
                  erJsBridge.setParameter("token", res.data.token, function (data) {
                    erJsBridge.setParameter("userID", res.data.userId, function (data) {
                      erJsBridge.setParameter("userName", res.data.nativeName, function (data) {
                        window.location.href = "../Main/Default.html?t=" + new Date().getTime();
                      });
                    });
                  });
                }
              },
              error: function (res) {},
            });
          },
        },
        created() {
          erMain.initialize(() => {});
        },
      });
    </script>
  </body>
</html>
