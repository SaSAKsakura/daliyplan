        //ISCP初始化
        function initiscp(callback, callbackError) {
            _loginLog.iscpIP = PIpcsi;
            const businessServiceInfoList = [{
                "acl_id": Number(AppId),
                "businessInfo": {
                    "sip": localPortIp,
                    "sport": Number(localPort)
                },
                gateway_id: Number(AppId)
            }];
            const gatewayServiceInfoList = [{
                "gatewayInfo": {
                    ip: connectIp,
                    port: Number(connectPort),
                    resource: {
                        "acl_id_list": [Number(AppId)],
                        "appId": connectAppid
                    },
                    type: 2
                },
                gateway_id: Number(AppId)
            }];
            const data = {
                "businessServiceInfoList": businessServiceInfoList,
                "gatewayServiceInfoList": gatewayServiceInfoList
            };
            console.log("ext_ISCP_RhConfig配置", data);
            wx.invoke("ext_ISCP_RhConfig", { data }, function (res) {
                _loginLog.ext_ISCP_Init = res;
                console.log("ext_ISCP_RhConfig ", res, res.err_msg);
                if (res.err_msg == 'ext_ISCP_RhConfig:ok') {
                    if (typeof (callback) == 'function') callback();
                } else {
                    alert("ISCP初始化失败");
                    if (typeof (callbackError) == 'function') callbackError();
                }
            })
        }

        function getWxCode() {
            let sURL = getWxCodeUrl + "?";
            sURL += "appid=" + wxappId;
            sURL += "&redirect_uri=" + encodeURIComponent("zipapp://local.host/index.html");
            sURL += "&response_type=code";
            sURL += "&scope=SCOPE";
            sURL += "&state=STATE";
            sURL += "&agentid=" + AppId;
            sURL += "#wechat_redirect";
            window.location.href = sURL;

        }
        function getParam(variable) {
            let query = window.location.search.substring(1);
            let vars = query.split("&");
            for (let i = 0; i < vars.length; i++) {
                var pair = vars[i].split("=");
                if (pair[0] == variable) {
                    return pair[1];
                }
            }
            return "";
        }

                                res();
                                return;
                            }
                        }
                    }
                    rej();
                });
            }).then((res, rej) => {
                return new Promise((res, rej) => {
                    appGetParameter("simulateUser", data => {
                        if (data.result == null || data.result == "" || data.result.value == null || data.result.value == "" || data.result.value == "0") {
                            res();
                            return;
                        }
                        rej();
                    });
                });
            }).then(() => {
                return new Promise((res, rej) => {
                    appGetParameter("token", data => {
                        if (!$.isEmptyObject(data.result) && typeof data.result.value === "string" && data.result.value.length > 0) {
                            _Token = data.result.value;
                            res();
                            return;
                        }
                        rej();
                    });
                });
            }).then(() => {
                //SS();


                appGetParameter("needConfirmFlag", data => {
                    if (!$.isEmptyObject(data.result) && typeof data.result.value === "string" && data.result.value.length > 0) {
                        needConfirmFlag = data.result.value;

                    }
                    if (needConfirmFlag == -1) {
                        window.location.href = "APP/Mine/PersonalInfo.html?t=" + new Date().getTime();
                    }
                    else {
                        window.location.href = "APP/Main/Default.html?t=" + new Date().getTime();
                    }
                });

            }).catch(() => {
                appSetParameter("simulateUser", "0", data => {
                    var param = {
                        "wx_code": wx_code,
                        UniqueID: _UniqueID,
                        MobileType: _deviceOS,
                        MobileOSVersion: "igw_qx",
                        AppVersionNumber: htmlVersion,
                        ticket: ticket,
                        "wxUserId": localStorage.userId,
                        "code": getCode()
                    };

                    if (param.UniqueID == undefined) {
                        param.UniqueID = ("igw_" + new Date().getTime());
                    }
                    if (param.MobileType == undefined) {
                        var ua = navigator.userAgent.toLowerCase();
                        if (ua.indexOf('iphone') > -1) {
                            _deviceOS = 'ios';
                        }
                        else {
                            _deviceOS = 'android';
                        }
                        param.MobileType = _deviceOS;
                    }

                    let url = "", method;
                    if (outFlag == -1) {
                        url = ("http://127.0.0.1:" + portResult + '/' + baseInfo.auth + '/api/main');
                        method = "validateUserIGW";
                    }
                    else {
                        url = outNetDomain + baseInfo.auth + '/api/main';
                        method = "";
                    }
                    var validateUserIGW = {};
                    validateUserIGW.param = param;
                    validateUserIGW.url = url;
                    validateUserIGW.method = method;
                    _loginLog.validateUserIGW = validateUserIGW;

                    $.ajax({
                        url: url,
                        type: "POST",
                        data: {
                            method: method,
                            detail: JSON.stringify({ json: param })
                        },
                        timeout: 20000,
                        success: function (rData) {
                            _loginLog.validateUserIGW.success = rData;
                            //   window.location.href = "APP/Main/ApplyAccount.html?userNum=" + rData.data.userNumber + "&userName=" + rData.data.userName + "&tk=" + ticket + "&t=" + new Date().getTime();
                            if (rData.type == -1) {
                                try {
                                    localStorage.aj_token = rData.data.aj_token;
                                    localStorage.aj_accessToken = rData.data.accessToken;
                                    localStorage.aj_tk = rData.data.tk;
                                    localStorage.userNumber = rData.data.userNumber;
                                } catch (ex) {
                                }
                                userMsg(rData);
                            }
                            else if (rData.type == 2) {
                                window.location.href = "APP/Main/ApplyAccount.html?userNum=" + rData.data.userNumber + "&userName=" + rData.data.userName + "&tk=" + ticket + "&t=" + new Date().getTime();
                            }
                            else {
                                goToSignin("");
                            }
                        },
                        error: function (rData) {
                            _loginLog.validateUserIGW.error = rData;
                            goToSignin("登录异常");
                        }
                    });
                });
            });
        }
