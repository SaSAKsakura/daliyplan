<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逸领域低代码平台 · 进度看板</title>
<style>
:root{
  --bg:#f7f7f5; --card:#ffffff; --line:#e3e2dd; --line2:#d3d1c7;
  --tx:#2c2c2a; --tx2:#5f5e5a; --tx3:#888780;
  --gray:#f1efe8; --gray-t:#5f5e5a;
  --amber:#faeeda; --amber-t:#854f0b;
  --blue:#e6f1fb; --blue-t:#185fa5;
  --green:#eaf3de; --green-t:#3b6d11;
  --green2:#c0dd97; --green2-t:#27500a;
  --red:#fcebeb; --red-t:#a32d2d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:19px;font-weight:600;margin:0 0 4px}
.sub{color:var(--tx2);font-size:13px;margin-bottom:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.stats{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.stat{min-width:78px}
.stat .n{font-size:24px;font-weight:600;line-height:1.2}
.stat .l{font-size:12px;color:var(--tx2)}
.bar{height:9px;background:var(--gray);border-radius:5px;overflow:hidden;margin:14px 0 6px;display:flex}
.bar i{display:block;height:100%}
.bar i.done{background:#639922}.bar i.doing{background:#ef9f27}
.barlg{display:flex;gap:16px;font-size:12px;color:var(--tx2)}
.barlg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
.barlg .a::before{background:#639922}.barlg .b::before{background:#ef9f27}.barlg .c::before{background:var(--line2)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button,select,input[type=text]{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line2);
  background:var(--card);color:var(--tx);border-radius:7px;cursor:pointer}
button:hover{background:var(--gray)}
input[type=text]{cursor:text;min-width:170px}
.phase{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.ph{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;user-select:none}
.ph:hover{background:#fafaf8}
.ph .tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:5px;background:var(--gray);color:var(--tx2)}
.ph .nm{font-weight:600;font-size:15px}
.ph .meta{color:var(--tx2);font-size:12px}
.ph .rt{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2)}
.mini{width:88px;height:6px;background:var(--gray);border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:#639922}
.rows{width:100%;border-collapse:collapse}
.rows th{font-size:12px;color:var(--tx2);font-weight:500;text-align:left;padding:8px 18px;background:#fafaf8;border-bottom:1px solid var(--line)}
.rows td{padding:9px 18px;border-bottom:1px solid #f0efea;vertical-align:top;font-size:13px}
.rows tr:last-child td{border-bottom:none}
.rows tr:hover td{background:#fafaf8}
.nm{font-weight:500}
.desc{color:var(--tx2);font-size:12px;margin-top:2px}
.risk{color:var(--red-t);background:var(--red);font-size:11px;padding:1px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.pri{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--gray);color:var(--tx2)}
.pri.p0{background:var(--red);color:var(--red-t)}
.sel{font-size:12px;padding:3px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--card);cursor:pointer;min-width:96px}
.s-gray{background:var(--gray);color:var(--gray-t);border-color:var(--line2)}
.s-amber{background:var(--amber);color:var(--amber-t);border-color:#ef9f27}
.s-blue{background:var(--blue);color:var(--blue-t);border-color:#85b7eb}
.s-green{background:var(--green);color:var(--green-t);border-color:#97c459}
.s-green2{background:var(--green2);color:var(--green2-t);border-color:#639922}
.doc{color:var(--tx3);font-size:12px}
.collapsed .rows{display:none}
.note{font-size:12px;color:var(--tx2);background:#fafaf8;border-left:3px solid var(--line2);padding:9px 12px;border-radius:0 6px 6px 0;margin-top:10px}
.foot{color:var(--tx3);font-size:12px;margin-top:18px;text-align:center}
@media(max-width:720px){.rows th:nth-child(4),.rows td:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>逸领域低代码平台 · 开发进度看板</h1>
  <div class="sub" id="sub">数据来源：《项目开发工作计划》阶段清单 + 《文档-代码映射台账》实现状态 + 《核心类设计台账》设计覆盖度</div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">任务总数</div></div>
      <div class="stat"><div class="n" id="s-done" style="color:#3b6d11">0</div><div class="l">已完成</div></div>
      <div class="stat"><div class="n" id="s-doing" style="color:#854f0b">0</div><div class="l">进行中</div></div>
      <div class="stat"><div class="n" id="s-todo" style="color:#888780">0</div><div class="l">未开始</div></div>
      <div class="stat"><div class="n" id="s-risk" style="color:#a32d2d">0</div><div class="l">风险项</div></div>
      <div class="stat"><div class="n" id="s-pct">0%</div><div class="l">整体完成率</div></div>
    </div>
    <div class="bar"><i class="done" id="b-done"></i><i class="doing" id="b-doing"></i></div>
    <div class="barlg">
      <span class="a">已完成（已实现自测 / 已验收）</span>
      <span class="b">进行中（编码中）</span>
      <span class="c">未开始</span>
    </div>
    <div class="note" id="syncinfo">尚未同步过进度</div>
  </div>

  <div class="tools">
    <select id="f-phase"><option value="">全部阶段</option></select>
    <select id="f-impl">
      <option value="">全部实现状态</option>
      <option>未开始</option><option>编码中</option><option>已实现自测</option><option>已验收</option>
    </select>
    <select id="f-design">
      <option value="">全部设计状态</option>
      <option>无设计</option><option>设计中</option><option>已定稿</option><option>不适用</option>
    </select>
    <input type="text" id="f-kw" placeholder="搜索任务 / 说明">
    <button id="btn-risk">只看风险项</button>
    <button id="btn-exp">导出 JSON</button>
    <button id="btn-imp">导入 JSON</button>
    <button id="btn-reset">重置为初始状态</button>
    <input type="file" id="file" accept=".json" style="display:none">
  </div>

  <div id="phases"></div>

  <div class="foot">状态改动自动保存在本机浏览器（localStorage）· 换设备或交接请用「导出 JSON / 导入 JSON」</div>
</div>

['P2-6','正式发布','全业务项目发布 + 发布手册 + 交接文档','P0','W18','不适用','未开始','—',''],
['P2-6','性能优化','首屏体积、懒加载策略、缓存命中率','P1','W17','设计中','未开始','REN §8.3 / YiPage §17.2',''],
['P2-6','多项目推广','apps/project-y 落地，验证共享包零侵入扩展','P1','W18','不适用','未开始','—',''],
['P2-6','全量回归 + 文档收尾','一致性回归、AGENT.md / 架构文档同步','P1','W18','不适用','未开始','跨文档引用矩阵',''],
['P2-6','YiMapViewer / YiIframeEmbed','地图（Leaflet/高德）、iframe 嵌入','P2','W18','无设计','未开始','BRIEF §6.10','']
];

var META={
 'P0-0':['P0-0 · Monorepo 工程底座','W1~W2 (08-31~09-11)','里程碑 M0 · 09-11'],
 'P0-1':['P0-1 · 核心运行时','W3~W7 (09-14~10-16)','里程碑 M1 · 10-16'],
 'P1-2':['P1-2 · 基础组件库','W7~W10 (10-12~11-06)','里程碑 M2 · 11-06'],
 'P1-3':['P1-3 · 增强组件与业务闭环','W10~W13 (11-02~11-27)','里程碑 M3 · 11-27'],
 'P1-4':['P1-4 · 双端适配 + 外壳 + 首项目','W13~W15 (11-23~12-11)','里程碑 M4 · 12-11'],
 'P2-5':['P2-5 · 动态扩展与安全体系','W15~W16 (11-30~12-18)','里程碑 M5 · 12-18'],
 'P2-6':['P2-6 · AI 助手与发布收尾','W17~W18 (12-21~12-31)','里程碑 M6 · 12-31']
};
var KEY='yi-progress-v1';
var st=load();

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items)return s;}catch(e){}
  return {items:{},log:[],updated:''};
}
function save(){localStorage.setItem(KEY,JSON.stringify(st));}

function get(i,f){return (st.items[i]&&st.items[i][f]!==undefined)?st.items[i][f]:DATA[i][f];}
function set(i,f,v){
  if(!st.items[i])st.items[i]={};
  var old=get(i,f); if(old===v)return;
  st.items[i][f]=v;
  st.log.unshift({t:new Date().toISOString().slice(0,16).replace('T',' '),
    task:DATA[i][1],field:f,from:old,to:v});
  if(st.log.length>300)st.log.length=300;
  st.updated=new Date().toISOString().slice(0,16).replace('T',' ');
  save();
}
function cell(i,f){
  var v=get(i,f);
  var opts=(f===5)?DESIGN:IMPL;
  var cls=(f===5)?DCLS[v]:ICLS[v];
  var h='<select class="sel '+cls+'" data-i="'+i+'" data-f="'+f+'">';
  opts.forEach(function(o){h+='<option'+(o===v?' selected':'')+'>'+o+'</option>';});
  return h+'</select>';
}
function done(i){var v=get(i,6);return v==='已实现自测'||v==='已验收';}
function doing(i){return get(i,6)==='编码中';}
function risk(i){return !!DATA[i][8];}

function render(){
  var fp=document.getElementById('f-phase').value;
  var fi=document.getElementById('f-impl').value;
  var fd=document.getElementById('f-design').value;
  var kw=document.getElementById('f-kw').value.trim().toLowerCase();
  var onlyRisk=document.getElementById('btn-risk').dataset.on==='1';
  var box=document.getElementById('phases');box.innerHTML='';
  var T=0,D=0,G=0,R=0;

  Object.keys(META).forEach(function(p){
    var idx=[];DATA.forEach(function(r,i){if(r[0]===p)idx.push(i);});
    var vis=idx.filter(function(i){
      if(fp&&DATA[i][0]!==fp)return false;
      if(fi&&get(i,6)!==fi)return false;
      if(fd&&get(i,5)!==fd)return false;
      if(onlyRisk&&!risk(i))return false;
      if(kw&&(DATA[i][1]+DATA[i][2]+DATA[i][7]).toLowerCase().indexOf(kw)<0)return false;
      return true;
    });
    if(!vis.length)return;
    var pd=vis.filter(done).length, pg=vis.filter(doing).length;
    var pct=Math.round(pd/vis.length*100);
    var h='<div class="phase" data-p="'+p+'"><div class="ph" onclick="this.parentNode.classList.toggle(\'collapsed\')">'
      +'<span class="tag">'+p+'</span><span class="nm">'+META[p][0].split('· ')[1]+'</span>'
      +'<span class="meta">'+META[p][1]+' · '+META[p][2]+'</span>'
      +'<span class="rt"><span>'+pd+'/'+vis.length+'</span><span class="mini"><i style="width:'+pct+'%"></i></span><span>'+pct+'%</span></span></div>';
    h+='<table class="rows"><thead><tr><th style="width:34%">任务</th><th style="width:9%">优先级</th><th style="width:7%">周期</th><th style="width:20%">说明</th><th style="width:11%">设计状态</th><th style="width:11%">实现状态</th><th style="width:12%">权威文档</th></tr></thead><tbody>';
    vis.forEach(function(i){
      var r=DATA[i];
      h+='<tr><td><div class="nm">'+r[1]+(risk(i)?'<span class="risk" title="'+r[8]+'">风险</span>':'')+'</div>'
        +(risk(i)?'<div class="desc" style="color:#a32d2d">'+r[8]+'</div>':'')
        +'</td><td><span class="pri '+(r[3]==='P0'?'p0':'')+'">'+r[3]+'</span></td><td class="doc">'+r[4]
        +'</td><td class="desc">'+r[2]+'</td><td>'+cell(i,5)+'</td><td>'+cell(i,6)
        +'</td><td class="doc">'+(r[7]||'—')+'</td></tr>';
      T++; if(done(i))D++; else if(doing(i))G++; if(risk(i))R++;
    });
    h+='</tbody></table></div>';
    box.innerHTML+=h;
  });

  document.getElementById('s-total').textContent=T;
  document.getElementById('s-done').textContent=D;
  document.getElementById('s-doing').textContent=G;
  document.getElementById('s-todo').textContent=T-D-G;
  document.getElementById('s-risk').textContent=R;
  var pct=T?Math.round(D/T*100):0;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('b-done').style.width=(T?D/T*100:0)+'%';
  document.getElementById('b-doing').style.width=(T?G/T*100:0)+'%';
  document.getElementById('syncinfo').textContent=st.updated
    ?('最后同步：'+st.updated+' · 累计 '+st.log.length+' 次状态变更 · 风险项 '+R+' 个（红色标记，悬停看原因）')
    :'尚未同步过进度 —— 直接在表中改状态即可自动保存';

  document.querySelectorAll('.sel').forEach(function(s){
    s.onchange=function(){
      set(+this.dataset.i,+this.dataset.f,this.value);
      render();
    };
    var v=(+s.dataset.f===5)?get(+s.dataset.i,5):get(+s.dataset.i,6);
    s.className='sel '+((+s.dataset.f===5)?DCLS[v]:ICLS[v]);
  });
}

var sel=document.getElementById('f-phase');
Object.keys(META).forEach(function(p){
  var o=document.createElement('option');o.value=p;o.textContent=META[p][0];sel.appendChild(o);
});
['f-phase','f-impl','f-design'].forEach(function(id){
  document.getElementById(id).onchange=render;
});
document.getElementById('f-kw').oninput=render;
document.getElementById('btn-risk').onclick=function(){
  this.dataset.on=this.dataset.on==='1'?'0':'1';
  this.style.background=this.dataset.on==='1'?'var(--red)':'';
  this.style.color=this.dataset.on==='1'?'var(--red-t)':'';
  render();
};
document.getElementById('btn-exp').onclick=function(){
  var out={exportedAt:new Date().toISOString(),updated:st.updated,log:st.log,
    items:DATA.map(function(r,i){return {phase:r[0],task:r[1],design:get(i,5),impl:get(i,6)};})};
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='yi-progress-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
};
document.getElementById('btn-imp').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(){
  var f=this.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o.items)throw 0;
      o.items.forEach(function(it,i){
        var m=DATA.findIndex(function(d){return d[1]===it.task;});
        if(m<0)return;
        if(it.design)set(m,5,it.design);
        if(it.impl)set(m,6,it.impl);
      });
      render();alert('导入成功，共 '+o.items.length+' 项');
    }catch(e){alert('导入失败：文件格式不正确');}
  };
  r.readAsText(f);this.value='';
};
document.getElementById('btn-reset').onclick=function(){
  if(!confirm('确定重置为初始状态？所有本机进度改动将丢失。'))return;
  st={items:{},log:[],updated:''};save();render();
};
render();
</script>
</body>
</html>
